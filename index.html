<script>

    /* ========================================= */
    /* STARFIELD */
    /* ========================================= */

    const starContainer = document.querySelector("#stars");

    for (let i = 0; i < 1500; i++) {

        const star = document.createElement("a-sphere");

        const x = (Math.random() - 0.5) * 250;
        const y = (Math.random() - 0.5) * 180;
        const z = -Math.random() * 220;

        const size = Math.random() * 0.08 + 0.025;

        const colors = [
            "#ffffff",
            "#bdefff",
            "#8ed8ff",
            "#d7baff",
            "#fff2b0"
        ];

        star.setAttribute("position", `${x} ${y} ${z}`);
        star.setAttribute("radius", size);
        star.setAttribute(
            "color",
            colors[Math.floor(Math.random() * colors.length)]
        );

        starContainer.appendChild(star);
    }


    /* ========================================= */
    /* PLANET ORBITS */
    /* ========================================= */

    const orbitData = [

        ["mercuryOrbit", 0.00040],
        ["venusOrbit",   0.00028],
        ["earthOrbit",   0.00020],
        ["marsOrbit",    0.00015],
        ["jupiterOrbit", 0.00009],
        ["saturnOrbit",  0.000065],
        ["uranusOrbit",  0.00005],
        ["neptuneOrbit", 0.000035]

    ];

    const orbits = [];

    orbitData.forEach(function(data) {

        const object = document.querySelector("#" + data[0]);

        if (object) {
            orbits.push({
                object: object,
                speed: data[1]
            });
        }

    });


    /* ========================================= */
    /* UFO MOVEMENT */
    /* ========================================= */

    const ufo1 = document.querySelector("#ufo1");
    const ufo2 = document.querySelector("#ufo2");
    const ufo3 = document.querySelector("#ufo3");

    let ufo1X = -25;
    let ufo2X = 25;
    let ufo3X = -30;

    let ufoTime = 0;


    /* ========================================= */
    /* MAIN ANIMATION LOOP */
    /* ========================================= */

    function animateSpace() {

        const time = performance.now();


        /* PLANET ORBITS */

        orbits.forEach(function(item) {

            item.object.object3D.rotation.y =
                time * item.speed;

        });


        /* EARTH ROTATION */

        const earth = document.querySelector("#earth");

        if (earth) {

            earth.object3D.rotation.y =
                time * 0.00018;

        }


        /* UFO 1 */

        ufo1X += 0.035;

        if (ufo1X > 35) {
            ufo1X = -35;
        }

        ufo1.object3D.position.x = ufo1X;

        ufo1.object3D.position.y =
            7 + Math.sin(time * 0.0015) * 1.2;

        ufo1.object3D.rotation.y =
            time * 0.001;


        /* UFO 2 */

        ufo2X -= 0.027;

        if (ufo2X < -35) {
            ufo2X = 35;
        }

        ufo2.object3D.position.x = ufo2X;

        ufo2.object3D.position.y =
            4 + Math.sin(time * 0.0018) * 0.8;

        ufo2.object3D.rotation.y =
            -time * 0.0015;


        /* UFO 3 */

        ufo3X += 0.02;

        if (ufo3X > 40) {
            ufo3X = -40;
        }

        ufo3.object3D.position.x = ufo3X;

        ufo3.object3D.position.y =
            10 + Math.sin(time * 0.0012) * 1.5;

        ufo3.object3D.rotation.y =
            time * 0.0008;


        requestAnimationFrame(animateSpace);

    }

    animateSpace();

</script>
